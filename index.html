<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>清平乐•醉清欢</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:"Songti SC","STSong",serif;background:#f3ecdd;color:#313b36;padding-bottom:70px}
        .header{background:#2f5d50;color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:bold;position:sticky;top:0;z-index:10}
        .content{padding:15px}
        .tab{display:none}.tab.active{display:block}
        .card{background:#fffdf7;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid rgba(120,100,70,.18)}
        h3{margin-bottom:10px;color:#2f5d50;font-size:16px;border-left:3px solid #2f5d50;padding-left:8px}
        textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:14px;font-family:inherit}
        button{background:#2f5d50;color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;width:100%;font-weight:bold}
        .nav{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#fff;display:flex;border-top:1px solid #ddd}
        .nav-item{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;color:#888;cursor:pointer}
        .nav-item.active{color:#2f5d50;font-weight:bold}
        .list-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
        #loginMask{position:fixed;inset:0;background:#1c3129;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
        #loginMask input{width:80%;text-align:center;padding:15px;font-size:16px;border-radius:10px;border:none;margin-bottom:15px}
        #loginMask button{width:80%;padding:15px;font-size:16px;background:#b08d57}
    </style>
</head>
<body>
    <div id="loginMask">
        <h2>清平乐 • 醉清欢</h2>
        <p style="margin:15px 0;font-size:12px;color:#aaa">请输入帮会码与昵称</p>
        <input type="text" id="inpRoom" placeholder="请输入帮会码">
        <input type="text" id="inpName" placeholder="请输入游戏昵称">
        <button onclick="doLogin()">进入清平乐</button>
    </div>

    <div class="header" id="headerTitle">清平乐</div>
    <div class="content">
        <div id="tab1" class="tab active">
            <div class="card"><h3>清平准则</h3><textarea id="rules" style="height:200px"></textarea><button onclick="saveRules()">保存准则</button></div>
            <div class="card"><h3>帮战接龙</h3><input id="signName" placeholder="输入ID"><button onclick="addSign()">接龙</button><div id="signList"></div></div>
        </div>
        <div id="tab2" class="tab"><div class="card"><h3>每日清平</h3><p>暂无公告</p></div></div>
        <div id="tab3" class="tab"><div class="card"><h3>花繁若轩</h3><textarea id="postText" placeholder="分享日常"></textarea><button onclick="addPost()">发布</button><div id="postList"></div></div></div>
        <div id="tab4" class="tab"><div class="card"><h3>蝶梦袅袅</h3><p>岁月静好</p></div></div>
        <div id="tab5" class="tab"><div class="card"><h3>好友</h3><p style="color:#d9534f">本知正在闭关，请回微信群交流</p></div></div>
    </div>
    <div class="nav">
        <div class="nav-item active" onclick="switchTab(1)">帮会</div>
        <div class="nav-item" onclick="switchTab(2)">清平</div>
        <div class="nav-item" onclick="switchTab(3)">花繁</div>
        <div class="nav-item" onclick="switchTab(4)">蝶梦</div>
        <div class="nav-item" onclick="switchTab(5)">好友</div>
    </div>
<script>
    // 1. 强制登录拦截 & 帮会码验证
    const savedUser = localStorage.getItem('ql_user');
    const mask = document.getElementById('loginMask');
    if(savedUser) { mask.style.display = 'none'; } 
    else { mask.style.display = 'flex'; }

    function doLogin() {
        const room = document.getElementById('inpRoom').value.trim();
        const name = document.getElementById('inpName').value.trim();
        if(room !== 'qingpingyue112603') { alert('帮会码错误，禁止入内！'); return; }
        if(!name) { alert('必须输入名字'); return; }
        localStorage.setItem('ql_user', name);
        mask.style.display = 'none';
        alert('验证成功！');
    }

    function switchTab(n) {
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t=>t.classList.remove('active'));
        document.getElementById('tab'+n).classList.add('active');
        document.querySelectorAll('.nav-item')[n-1].classList.add('active');
    }

    // 2. 核心数据与渲染
    const rules = document.getElementById('rules');
    rules.value = localStorage.getItem('ql_rules') || '1. 团结友爱，互助和谐。\n2. 向阳而生，快乐成长。';
    function saveRules() { localStorage.setItem('ql_rules', rules.value); alert('保存成功'); }

    let signs = JSON.parse(localStorage.getItem('ql_signs')||'[]');
    function renderSigns() {
        let html = signs.length ? '' : '<p style="color:#999;font-size:12px">暂无接龙</p>';
        signs.forEach((s,i)=> { html += `<div class="list-item"><span>${i+1}. ${s}</span><button style="width:auto;padding:2px 8px;margin:0" onclick="delSign(${i})">取消</button></div>`; });
        document.getElementById('signList').innerHTML = html;
    }
    function addSign() {
        let n = document.getElementById('signName').value.trim();
        if(!n) return; if(signs.includes(n)) { alert('每人限一次'); return; }
        signs.push(n); localStorage.setItem('ql_signs', JSON.stringify(signs));
        document.getElementById('signName').value=''; renderSigns();
    }
    function delSign(i) { signs.splice(i,1); localStorage.setItem('ql_signs', JSON.stringify(signs)); renderSigns(); }

    let posts = JSON.parse(localStorage.getItem('ql_posts')||'[]');
    function renderPosts() {
        let html = posts.length ? '' : '<p style="color:#999;font-size:12px">暂无动态</p>';
        posts.forEach((p,i)=> { html += `<div class="card" style="margin-top:10px"><b style="color:#2f5d50">${savedUser}</b><p style="margin:5px 0">${p}</p><button style="width:auto;padding:2px 8px;background:#d9534f" onclick="delPost(${i})">删除</button></div>`; });
        document.getElementById('postList').innerHTML = html;
    }
    function addPost() {
        let t = document.getElementById('postText').value.trim();
        if(!t) return; posts.unshift(t); localStorage.setItem('ql_posts', JSON.stringify(posts));
        document.getElementById('postText').value=''; renderPosts();
    }
    function delPost(i) { posts.splice(i,1); localStorage.setItem('ql_posts', JSON.stringify(posts)); renderPosts(); }

    window.onload = ()=> { renderSigns(); renderPosts(); };
</script>
</body>
          </html>
