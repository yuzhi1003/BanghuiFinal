name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Build APK
      run: |
        echo '{"name":"app","version":"1.0.0"}' > package.json
        npm install @capacitor/core @capacitor/cli @capacitor/android
        mkdir www
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>帮会交接</title></head><body><h1>情义帮 · 交接清单</h1><p>测试版</p></body></html>' > www/index.html
        npx cap init Banghui com.yuzhi.banghui --web-dir www
        npx cap add android
        npx cap sync android
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
