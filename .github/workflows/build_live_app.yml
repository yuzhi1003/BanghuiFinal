name: Build Live APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Prepare Android Project Files
      run: |
        mkdir -p app/src/main/java/com/yuzhi/qingpingyue
        mkdir -p app/src/main/res/values
        
        cat > build.gradle <<'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
        }
        EOF
        
        cat > settings.gradle <<'EOF'
        rootProject.name = "QingPingYue"
        include ':app'
        EOF
        
        cat > app/build.gradle <<'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.yuzhi.qingpingyue'
            compileSdk 34
            defaultConfig {
                applicationId "com.yuzhi.qingpingyue"
                minSdk 24
                targetSdk 34
                versionCode 4
                versionName "4.0"
            }
        }
        EOF
        
        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="清平乐" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat > app/src/main/java/com/yuzhi/qingpingyue/MainActivity.java <<'EOF'
        package com.yuzhi.qingpingyue;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                // 这里直接加载你最新的 v=4 网址！
                webView.loadUrl("https://yuzhi1003.github.io/BanghuiFinal/?v=4");
                setContentView(webView);
            }
        }
        EOF
    - name: Build APK with Gradle
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload Live APK
      uses: actions/upload-artifact@v4
      with:
        name: QingPingYue-Live-APK
        path: app/build/outputs/apk/debug/app-debug.apk
