name: 打包 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: 编译并签名
        run: bash android/build.sh

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 清平乐-醉清欢
          path: 清平乐-醉清欢.apk
